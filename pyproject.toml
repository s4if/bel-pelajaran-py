[project]
name = "bel-pelajaran"
version = "0.2.0"
description = "Bel Pembelajaran sekolah — jadwal bel otomatis berbasis Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "s4if" }]
dependencies = [
    # Lightweight, familiar scheduler. (See ROADMAP for a future APScheduler swap.)
    "schedule>=1.2,<2",
    # NOTE: tomllib is stdlib since Python 3.11 — no third-party TOML lib needed.
]

[project.optional-dependencies]
# Qt is optional so validation and --dry-run remain usable without a GUI/audio
# stack. Qt Multimedia is imported lazily by app.audio.
qt = ["PySide6>=6.7,<7", "tomli_w>=1,<2"]
gui = ["PySide6>=6.7,<7", "tomli_w>=1,<2"]

[project.scripts]
# Installs a `bel` console script after `uv sync` / `pip install .`
bel = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",   # for `bel package` / building the exe (see README)
    "PySide6>=6.7,<7",
    "tomli_w>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
